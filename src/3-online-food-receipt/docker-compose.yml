services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_receipt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      LLM__OPENAI_API_KEY: ${LLM__OPENAI_API_KEY}
      LLM__MODEL_NAME: ${LLM__MODEL_NAME:-gpt-4o-mini}
      LLM__BASE_URL: ${LLM__BASE_URL}
      DATABASE__DSN: postgresql://postgres:postgres@postgres:5432/food_receipt
      DATABASE__MIN_POOL_SIZE: ${DATABASE__MIN_POOL_SIZE:-1}
      DATABASE__MAX_POOL_SIZE: ${DATABASE__MAX_POOL_SIZE:-5}
      STORAGE__RECEIPTS_DIR: data/receipts
    volumes:
      - receipts_data:/app/data/receipts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  receipts_data:
